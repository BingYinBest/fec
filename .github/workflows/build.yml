name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: fec-${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, armv7a, x86_64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android NDK r26d
        uses: android-ndk/ndk-setup@v1
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Build static fec (${{ matrix.arch }})
        run: ./build.sh ${{ matrix.arch }}
        env:
          NDK: $ANDROID_NDK_HOME

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fec-${{ matrix.arch }}
          path: out/${{ matrix.arch }}/fec
          if-no-files-found: error

  smoke:
    # Native build on ubuntu + end-to-end check with avbtool, to make sure
    # the tool still speaks the interface avbtool expects.
    name: native-smoke-test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3

      - name: Build native fec
        run: ./build.sh native

      - name: Fetch avbtool
        run: |
          curl -fsSL \
            "https://android.googlesource.com/platform/external/avb/+/refs/heads/main/avbtool?format=TEXT" \
            | base64 -d > /tmp/avbtool
          chmod +x /tmp/avbtool

      - name: avbtool add_hashtree_footer + verify
        run: |
          export PATH="$PWD/out/native:$PATH"
          dd if=/dev/urandom of=/tmp/test.img bs=4096 count=64 2>/dev/null
          python3 /tmp/avbtool add_hashtree_footer \
            --image /tmp/test.img --partition_size 524288 \
            --partition_name system --fec_num_roots 2 --hash_algorithm sha256
          cp /tmp/test.img /tmp/system.img
          python3 /tmp/avbtool verify_image --image /tmp/test.img

  release:
    name: publish-release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package and checksums
        run: |
          mkdir -p dist
          for a in aarch64 armv7a x86_64; do
            cp artifacts/fec-$a/fec dist/fec-$a
          done
          cd dist && sha256sum fec-* > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
